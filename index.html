<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Project</title>
       <style> 
        #red {
            background-color: red;
        }

        #green {
            background-color: green;
        }

        #blue {
            background-color: blue;
        }

        button {
            margin: 10px;
            font-size: 24px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>Button Game</h2>

    <button id="red" onclick="setColour('red')">Red</button>
    <button id="green" onclick="setColour('Green')">Green</button>
    <button id="blue" onclick="setColour('Blue')">Blue</button>
    <button onclick="randColour()">Random</button>
    <script src="script.js"></script>
</body>
</html>
